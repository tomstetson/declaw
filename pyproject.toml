[tool.ruff]
target-version = "py310"
line-length = 100
extend-include = [
  "scripts/declaw-secrets/declaw-secrets",
  "scripts/declaw-doctor/declaw-doctor",
  "scripts/declaw-monitor/declaw-monitor",
]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "I"]

[tool.pytest.ini_options]
testpaths = ["tests/python", "skills"]
python_files = ["test_*.py"]
